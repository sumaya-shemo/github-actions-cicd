<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Catalog | Express App</title>
  <style>
    :root {
      font-family: Inter, system-ui, sans-serif;
      color: #14243b;
      background: #f4f7fb;
      line-height: 1.5;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    .container { width: min(100% - 2rem, 68rem); margin-inline: auto; }

    .site-header {
      background: #fff;
      border-bottom: 1px solid #e0e7f0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding-block: 1rem;
      font-weight: 750;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: .55rem;
      background: #1d4ed8;
      color: #fff;
    }

    main { padding-block: clamp(1.25rem, 5vw, 3rem) 4rem; }

    .hero {
      padding: clamp(1.5rem, 6vw, 4rem);
      border-radius: 1.25rem;
      background: radial-gradient(ellipse at top right, #254b94, transparent 70%), #101f3d;
      color: #fff;
    }

    h1, h2, h3, p { margin: 0; }
    h1 {
      font-size: clamp(2rem, 6vw, 3.75rem);
      line-height: 1.1;
      letter-spacing: -.045em;
    }

    .api-message { margin-top: .85rem; color: #dce8ff; overflow-wrap: anywhere; }
    .catalog { margin-top: 2rem; }
    h2 { font-size: 1.25rem; }
    .notice { margin-top: .75rem; color: #485a73; }
    .notice.error { color: #9a3412; }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
      gap: 1rem;
      margin: 1rem 0 0;
      padding: 0;
      list-style: none;
    }

    .product {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 1.25rem;
      border: 1px solid #dce5f0;
      border-radius: .9rem;
      background: #fff;
      box-shadow: 0 4px 12px rgb(20 36 59 / 5%);
    }

    .product h3 { font-size: 1.05rem; overflow-wrap: anywhere; }
    .product-details {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .5rem .75rem;
      margin-top: auto;
    }

    .price { font-size: 1.35rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    .stock {
      padding: .25rem .65rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 650;
      color: #166534;
      background: #dcfce7;
    }
    .stock.unavailable { color: #9a3412; background: #ffedd5; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container brand"><span class="brand-mark" aria-hidden="true">E</span>Express App</div>
  </header>

  <main class="container">
    <div class="hero">
      <h1>Product Catalog</h1>
      <p id="msg" class="api-message" role="status">Loading API response…</p>
    </div>

    <section class="catalog" aria-labelledby="products-heading">
      <h2 id="products-heading">Products</h2>
      <p id="products-status" class="notice" role="status">Loading products…</p>
      <ul id="products" class="products" role="list"></ul>
    </section>
  </main>

  <script>
    const message = document.getElementById("msg");
    const products = document.getElementById("products");
    const productsStatus = document.getElementById("products-status");
    const currency = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD"
    });

    async function getJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    }

    function createProductCard(product) {
      const card = document.createElement("li");
      card.className = "product";

      const name = document.createElement("h3");
      name.textContent = product.name;

      const details = document.createElement("div");
      details.className = "product-details";

      const price = document.createElement("span");
      price.className = "price";
      price.textContent = currency.format(product.price);

      const stock = document.createElement("span");
      stock.className = product.inStock ? "stock" : "stock unavailable";
      stock.textContent = product.inStock ? "In stock" : "Out of stock";

      details.append(price, stock);
      card.append(name, details);
      return card;
    }

    async function loadGreeting() {
      try {
        const data = await getJson("/api/hello?name=Express");
        message.textContent = data.message;
      } catch {
        message.textContent = "The API greeting is currently unavailable.";
      }
    }

    async function loadProducts() {
      try {
        const items = await getJson("/api/products");
        if (items.length === 0) {
          productsStatus.textContent = "No products are available.";
          return;
        }

        const cards = document.createDocumentFragment();
        for (const item of items) {
          cards.append(createProductCard(item));
        }
        products.replaceChildren(cards);
        productsStatus.textContent = items.length === 1 ? "1 product" : items.length + " products";
      } catch {
        productsStatus.classList.add("error");
        productsStatus.textContent = "Couldn’t load products. Refresh the page to try again.";
      }
    }

    loadGreeting();
    loadProducts();
  </script>
</body>
</html>
